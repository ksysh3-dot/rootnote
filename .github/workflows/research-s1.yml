name: Study 1 impact attribution (host only)

on:
  push:
    branches:
      - research/impact-attribution-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-a:
    name: Phase A non-additive stage interaction (development cohort)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host research dependencies
        run: pip install numpy scipy soundfile
      - name: Build host engine
        run: |
          gcc --version | head -1
          tools/pvb-harness/build_host.sh
      - name: Phase A.1 (state deviation; output -18 dB test level and -3 dB app ceiling)
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          cd tools/pvb-harness
          python3 research_s1_interaction.py --out-db -18 --report ../../s1-phaseA1-out18.json
          python3 research_s1_interaction.py --out-db -3 --report ../../s1-phaseA1-out3.json
      - name: Phase B (development cohort; self-injection integrity, then B1/B2/B12)
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          cd tools/pvb-harness
          python3 research_s1_counterfactual.py --report ../../s1-phaseB-dev.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study1-phaseA1-B
          path: s1-phase*.json
