name: Rootnote build

# Every push to a branch and every pull request builds both flavors and uploads them as artifacts only.
# A GitHub release is made only for tags general-v* (general build, signed with the GENERAL_* secrets; see
# RELEASE_GENERAL.md). The s26u flavor (personal channel) is built for testing but never released from this repository.
on:
  push:
    branches: [ '**', '!ci-log*' ]
    tags: [ 'general-v*' ]
    # Documentation-only pushes do not build. (Path filters are not applied to tag pushes.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # libjamesdsp: the JamesDSP -> PVB chain test runs the real JamesDSP engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Motion rules of the general screens (docs/DESIGN.md 6)
        run: python3 tools/check_motion.py

      - name: Static checks (reflection names, manifest, start order, versions, motion guard)
        run: python3 tools/test_static.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare pinned Kotlin compiler
        run: tools/pvb-harness/jvm/bootstrap_kotlin.sh

      - name: Install test dependencies
        run: pip install numpy scipy soundfile

      - name: Build engine for the host and run the test suite
        run: |
          set -o pipefail
          {
            tools/pvb-harness/build_host.sh &&
            python3 tools/pvb-harness/test_engine.py --report engine-report.json &&
            OPENBLAS_NUM_THREADS=1 python3 tools/pvb-harness/test_diagnostic_solo.py &&
            OPENBLAS_NUM_THREADS=1 python3 tools/pvb-harness/test_xtc.py &&
            python3 tools/xtc/check_eel_port.py &&
            python3 tools/xtc/xtc_native_check.py &&
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp/libpvb tools/pvb-harness/vb_quality/test_track_prediction.cpp -o /tmp/pvb-track-prediction && /tmp/pvb-track-prediction &&
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp/libpvb tools/pvb-harness/vb_quality/test_continuity_policy.cpp -o /tmp/pvb-continuity-policy && /tmp/pvb-continuity-policy &&
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp/libpvb -Itools/pvb-harness tools/pvb-harness/fit_equivalence.cpp -o /tmp/pvb-fit-equivalence && /tmp/pvb-fit-equivalence &&
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp/libpvb tools/pvb-harness/fastmath_check.cpp -o /tmp/pvb-fastmath-check && /tmp/pvb-fastmath-check &&
            clang++ -std=c++17 -O2 -mfma -ffp-contract=on -fno-fast-math -Iapp/src/main/cpp/libpvb -Itools/pvb-harness tools/pvb-harness/fit_equivalence.cpp -o /tmp/pvb-fit-equivalence-fma && /tmp/pvb-fit-equivalence-fma &&
            clang++ -std=c++17 -O2 -mfma -ffp-contract=on -fno-fast-math -Iapp/src/main/cpp/libpvb tools/pvb-harness/fastmath_check.cpp -o /tmp/pvb-fastmath-check-fma && /tmp/pvb-fastmath-check-fma &&
            python3 tools/pvb-harness/match/test_match.py &&
            tools/pvb-harness/build_host_jdsp.sh &&
            tools/rootfx/build_host.sh &&
            OPENBLAS_NUM_THREADS=1 python3 tools/pvb-harness/test_jdsp_chain.py --report jdsp-chain-report.json &&
            tools/pvb-harness/jvm/run_jvm_test.sh
          } 2>&1 | tee ci-build.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-report
          path: |
            engine-report.json
            jdsp-chain-report.json
            ci-build.log

  apk:
    name: Build APKs (s26u + general)
    needs: engine-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every branch/PR/tag builds with a fresh throwaway debug key. No GENERAL_* secrets here.
      - name: Create a throwaway test key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/test-debug.jks" \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=Rootnote CI test'
          cp "$RUNNER_TEMP/test-debug.jks" "$HOME/.android/debug.keystore"

      - name: Source archive with submodules (GPL-3.0 corresponding source)
        run: |
          set -euo pipefail
          mkdir -p dist-general
          git ls-files -z --recurse-submodules | tar --null -T - -czf "dist-general/source-${GITHUB_SHA::7}.tar.gz"
          ls -l dist-general

      - name: Build test APKs with the throwaway key
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRootlessFdroidS26uRelease assembleRootlessFdroidGeneralRelease assembleRootFdroidGeneralRelease 2>&1 | tee ci-build.log

      - name: Collect s26u APK (test build, not released)
        id: collect
        run: |
          set -e
          out=app/build/outputs/apk/rootlessFdroidS26u/release
          ls -l "$out/"
          apk=$(ls $out/*universal*.apk 2>/dev/null | head -1)
          [ -n "$apk" ] || apk=$(ls $out/*.apk | head -1)
          mkdir -p dist
          name="PVB-S26U-test${{ github.run_number }}.apk"
          cp "$apk" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Verify s26u APK signature and record checksum
        run: |
          set -euo pipefail
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --verbose "dist/${{ steps.collect.outputs.name }}"
          "$tools/aapt" dump badging "dist/${{ steps.collect.outputs.name }}" > dist/apk-info.txt
          head -1 dist/apk-info.txt
          # The personal channel must keep its package (flavor change guard).
          grep -q "^package: name='kr.ksysh3.pvb.s26u'" dist/apk-info.txt || { echo "s26u package changed" >&2; exit 1; }
          echo "::notice title=s26u APK::$(head -1 dist/apk-info.txt) $(grep "^application-label:" dist/apk-info.txt)"
          cd dist
          sha256sum "${{ steps.collect.outputs.name }}" > "${{ steps.collect.outputs.name }}.sha256"
          cat "${{ steps.collect.outputs.name }}.sha256"

      - name: Collect, verify and name the general APK
        id: general
        run: |
          set -euo pipefail
          out=app/build/outputs/apk/rootlessFdroidGeneral/release
          ls -l "$out/"
          apk=$(ls $out/*universal*.apk 2>/dev/null | head -1)
          [ -n "$apk" ] || apk=$(ls $out/*.apk | head -1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/aapt" dump badging "$apk" > dist-general/apk-info.txt
          head -1 dist-general/apk-info.txt
          brand=$(sed -n "s/^application-label:'\(.*\)'$/\1/p" dist-general/apk-info.txt | head -1)
          version=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" dist-general/apk-info.txt | head -1)
          package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" dist-general/apk-info.txt | head -1)
          expected=$(sed -n 's/.*GENERAL_APPLICATION_ID = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/AndroidConfig.kt)
          test -n "$expected" && test "$package" = "$expected" || { echo "unexpected general package $package (expected $expected)" >&2; exit 1; }
          # Records stay out of the general build: no microphone foreground service, no buzz/live A/B screens.
          if grep -q "FOREGROUND_SERVICE_MICROPHONE" dist-general/apk-info.txt; then echo "general APK requests the microphone FGS permission" >&2; exit 1; fi
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee dist-general/signature.txt
          echo "::notice title=general APK::$(head -1 dist-general/apk-info.txt) label=$brand signer=$(grep -m1 'certificate SHA-256' dist-general/signature.txt | sed 's/.*: //')"
          suffix="-UNSIGNED-TEST"
          base="${brand:-general}-${version}${suffix}"
          cp "$apk" "dist-general/$base.apk"
          (cd dist-general && sha256sum "$base.apk" > "$base.apk.sha256" && cat "$base.apk.sha256")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "brand=$brand" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Rootnote for rooted phones: the JamesDSP audio effect with the PVB engine as a Magisk module (docs/ROOT_BUILD_PLAN.md)
      - name: Build the root effect module (Magisk)
        run: |
          set -o pipefail
          tools/rootfx/build_android.sh 2>&1 | tee ci-build.log

      - name: Collect the general root APK (rooted phones, with the module)
        run: |
          set -euo pipefail
          out=app/build/outputs/apk/rootFdroidGeneral/release
          ls -l "$out/"
          apk=$(ls $out/*universal*.apk 2>/dev/null | head -1)
          [ -n "$apk" ] || apk=$(ls $out/*.apk | head -1)
          ver=$(sed -n 's/.*generalVersionName = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/AndroidConfig.kt)
          suffix="-UNSIGNED-TEST"
          name="Rootnote-root-$ver$suffix.apk"
          mkdir -p dist-root
          cp "$apk" "dist-root/$name"
          (cd dist-root && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/aapt" dump badging "dist-root/$name" | head -1

      - name: Upload root module artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rootnote-JamesDSP-module
          path: dist-root/*

      - name: Upload s26u APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PVB-S26U-test-apk
          path: dist/*

      - name: Upload general APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.general.outputs.base }}
          path: dist-general/*

      - name: Collect release inputs (still test signed)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/general-v')
        run: cp RELEASE_NOTES_GENERAL.md dist-general/RELEASE_NOTES_GENERAL.md

      - name: Upload release inputs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/general-v')
        uses: actions/upload-artifact@v4
        with:
          name: general-release-inputs
          path: dist-general/*

  release-gate:
    name: Validate release tag on main lineage
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/general-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      version: ${{ steps.gate.outputs.version }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check lineage, peeled tag commit and source version before secrets
        id: gate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          sha=$(git rev-parse 'HEAD^{commit}')
          test "$sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$sha" = "$(git rev-parse "$GITHUB_REF^{commit}")"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          version=$(sed -n 's/^[[:space:]]*const val generalVersionName = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/AndroidConfig.kt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          test "$TAG" = "general-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

  release:
    name: Sign and release approved general tag
    needs: [engine-tests, apk, release-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/general-v') && needs.release-gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    # Required manual setup: environment-scoped GENERAL_* secrets, protected general-v* tags,
    # reviewer approval, no self-review/bypass; remove repository-scoped copies of the release secrets.
    environment: general-release
    permissions:
      contents: write
    steps:
      # Never checkout/run app Gradle scripts in the key-bearing job. Sign only this run's artifact.
      - uses: actions/download-artifact@v4
        with:
          name: general-release-inputs
          path: release-inputs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Validate the built APK identity and source archive
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          SOURCE_SHA: ${{ needs.release-gate.outputs.sha }}
        run: |
          set -euo pipefail
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          test -f "release-inputs/Rootnote-$VERSION-UNSIGNED-TEST.apk"
          test -f "release-inputs/source-${SOURCE_SHA::7}.tar.gz"
          "$tools/aapt" dump badging "release-inputs/Rootnote-$VERSION-UNSIGNED-TEST.apk" > "$RUNNER_TEMP/apk-info.txt"
          grep -q "^package: name='kr.ksysh3.rootnote' " "$RUNNER_TEMP/apk-info.txt"
          actual=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/apk-info.txt" | head -1)
          test "$actual" = "$VERSION"
      - name: Sign verified test APK with release key
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          SOURCE_SHA: ${{ needs.release-gate.outputs.sha }}
          GENERAL_KEYSTORE_B64: ${{ secrets.GENERAL_KEYSTORE_B64 }}
          GENERAL_KEYSTORE_PASSWORD: ${{ secrets.GENERAL_KEYSTORE_PASSWORD }}
          GENERAL_KEY_ALIAS: ${{ secrets.GENERAL_KEY_ALIAS }}
          GENERAL_KEY_PASSWORD: ${{ secrets.GENERAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/general-release.jks"
          trap 'rm -f -- "$key"' EXIT
          test -n "$GENERAL_KEYSTORE_B64" && test -n "$GENERAL_KEYSTORE_PASSWORD"
          test -n "$GENERAL_KEY_ALIAS" && test -n "$GENERAL_KEY_PASSWORD"
          printf '%s' "$GENERAL_KEYSTORE_B64" | base64 -d > "$key"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist-release
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$GENERAL_KEY_ALIAS" \
            --ks-pass env:GENERAL_KEYSTORE_PASSWORD --key-pass env:GENERAL_KEY_PASSWORD \
            --out "dist-release/Rootnote-$VERSION.apk" "release-inputs/Rootnote-$VERSION-UNSIGNED-TEST.apk"
          "$tools/apksigner" verify --verbose --print-certs "dist-release/Rootnote-$VERSION.apk" > dist-release/signature.txt
          expected=$(keytool -exportcert -keystore "$key" -alias "$GENERAL_KEY_ALIAS" \
            -storepass:env GENERAL_KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)
          # Older apksigner prints "Signer #1 certificate ..."; build-tools 37 prints one "V2 Signer: certificate ..." line per scheme.
          actual=$(sed -En 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' dist-release/signature.txt | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)
          test "$actual" = "$expected"
          cp "release-inputs/source-${SOURCE_SHA::7}.tar.gz" dist-release/
          (cd dist-release && sha256sum *.apk source-*.tar.gz > SHA256SUMS)
      - name: Publish the verified general release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rootnote ${{ needs.release-gate.outputs.version }}
          prerelease: ${{ contains(needs.release-gate.outputs.version, '-') }}
          make_latest: 'false'
          body_path: release-inputs/RELEASE_NOTES_GENERAL.md
          files: dist-release/*
